project:
  name: EduTrace-Open
  version: "0.1.0"
  random_seed: 20261110
  timezone: "Asia/Kolkata"

generation:
  profile: pilot
  num_institutions: 1
  num_programmes: 2
  num_courses_per_programme: 4
  num_modules_per_course: 3
  num_learners: 200
  num_academic_years: 2
  semesters_per_year: 2
  weeks_per_semester: 15
  resources_per_module: 4
  assessment_items_per_module: 2
  mean_events_per_learner_week: 10.0
  mean_support_events_per_learner: 0.5
  academic_calendar_start: "2024-08-01"

output:
  directory: data/generated
  formats: [parquet, csv]
  compression: zstd
  row_group_size: 100000
  include_manifest: true

pipeline:
  chunk_size: 10000
  checkpoint:
    enabled: true
    directory: checkpoints
    every_n_learners: 1000

validation:
  enabled: true
  strict: false
  check_primary_keys: true
  check_foreign_keys: true
  check_temporal_integrity: true
  check_distributions: false
  check_leakage: true
